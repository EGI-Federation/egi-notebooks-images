name: base
channels:
  - conda-forge
dependencies:
  - "cftime"
  - "ipympl"
  - "jmespath"
  - "psycopg2"
  - "boto3"
  - "folium"
  - "tqdm"
  - "lxml"
  - "pymongo"
  - "rasterstats"
  - "geopandas"
  - "ipywidgets"
  - "matplotlib"
  - "scipy"
  - "lightgbm"
  - "plotly"
  - "graphviz"
  - "jq"
  - "nb_conda_kernels"
  - "python-dateutil"
  - "h5glance"
  - "panel"
  - "tensorflow"
  # resource usage info in GUI
  - "jupyter-resource-usage=1.2.0"
  # RTC
  - "jupyter-collaboration"
  # conda-switcher required dependencies
  - "patchelf>=0.19"
  - "conda-pack"
  # these were before as separate pip installs
  # v2.5.0 breaks RStudio
  - "jupyter-rsession-proxy>=2.5.1"
  # octave kernel
  - "octave_kernel=0.32.0"

  - pip:
      - nbtop
      # share-manager extensions
      - git+https://gitlab.cesnet.cz/702/projekty/eosc-notebooks/user-sharing-extension
      - git+https://gitlab.cesnet.cz/702/projekty/eosc-notebooks/jupyterlab-token-acquirer
      # conda-switcher extension
      - git+https://gitlab.cesnet.cz/702/projekty/eosc-notebooks/conda-switcher
