---
name: Build and push EGI containers

on:
  push:
    # only pushes on master so we don't push intermediate results to dockerhub
    branches:
      - master
  pull_request:

jobs:
  user-images:
    name: Build and push images
    runs-on: ubuntu-latest

    steps:
      - name: try to make free space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
      - name: Checkout
        uses: actions/checkout@v7
      - name: Docker meta data
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ""
          tags: |
            type=sha
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        if: github.event_name != 'pull_request'
      - name: Build single-user
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: eginotebooks/single-user:${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          context: single-user
          file: single-user/Dockerfile
          target: single-user
      - name: Build single-user-eosc
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: eginotebooks/single-user-eosc:${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          context: single-user
          file: single-user/Dockerfile
          target: single-user-eosc
      - name: Build single-user-ai
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: eginotebooks/single-user-ai:${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          context: single-user
          file: single-user/Dockerfile
          target: single-user-ai
      - name: Run tests
        run: |
          set -xe
          for image in "single-user" "single-user-eosc" "single-user-ai"; do
            pushd "single-user/tests/$image"
            for test in *.ipynb; do
              echo "Testing $test with $image"
              docker run -v "${{ github.workspace }}/single-user/tests/$image:/tests/$image" \
                "eginotebooks/$image:${{ steps.docker_meta.outputs.tags }}" \
                   /bin/sh -c "jupyter nbconvert --ExecutePreprocessor.timeout=600 --to rst --execute --stdout  /tests/$image/$test || exit 1"
            done
            popd
          done
        if: github.event_name == 'pull_request'
