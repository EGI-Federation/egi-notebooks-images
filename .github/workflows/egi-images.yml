---
name: Build and push EGI containers

on:
  push:
    # only pushes on master so we don't push intermediate results to dockerhub
    branches:
      - master
  pull_request:

jobs:
  detect-changes:
    uses: ./.github/workflows/build-list.yml
    with:
      base: base/Dockerfile
      images: |
        "single-user/Dockerfile"

  user-images:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [base-image, detect-changes]

    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: try to make free space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
      - name: Checkout
        uses: actions/checkout@v7
      - name: Docker meta
        id: docker_meta_single_user
        uses: docker/metadata-action@v6
        with:
          images: eginotebooks/single-user
          tags: |
            type=sha
      - name: Docker meta
        id: docker_meta_single_user_eosc
        uses: docker/metadata-action@v6
        with:
          images: eginotebooks/single-user-eosc
          tags: |
            type=sha
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        if: github.event_name != 'pull_request'
      - name: Build single-user
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.docker_meta_single_user.outputs.tags }}
          labels: ${{ steps.docker_meta_single_user.outputs.labels }}
          context: .
          file: Dockerfile
          target: single-user
      - name: Build single-user_eosc
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.docker_meta_single_user_eosc.outputs.tags }}
          labels: ${{ steps.docker_meta_single_user_eosc.outputs.labels }}
          context: .
          file: Dockerfile
          target: single-user-eosc
      - name: Run tests
        run: |
          set -e
          echo "this should do test the image"
          # for f in /image-data/tests/*.ipynb; do
          #   if [ -e "$f" ]; then
          #       jupyter nbconvert --ExecutePreprocessor.timeout=600 --to rst \
          #              --execute --stdout $f || exit 1
          #   else
          #     true
          #   fi
          # done
        if: github.event_name == 'pull_request'
